name: Syncthing
version: "2.1.5-r0"
slug: syncthing
description: "Syncthing is a continuous file synchronization program in a
  de-centralized way"
url: "https://github.com/nyok92/hassio-addons/tree/main/syncthing"
arch:
  - aarch64
  - amd64
homeassistant: 0.115.0
image: "ghcr.io/nyok92/syncthing"
init: false
ports:
  8384/tcp: null
  22000/tcp: 22000
  21027/udp: 21027
ports_description:
  8384/tcp: Web frontend (not needed with Ingress)
  22000/tcp: Sync protocol
  21027/udp: Discovery broadcast
ingress: true
ingress_port: 8384
panel_title: Syncthing
panel_icon: mdi:sync
map:
  - homeassistant_config:rw
  - app_config:rw
  - ssl:rw
  - local_apps:rw
  - backup:rw
  - share:rw
  - media:rw
  - data:rw
  - all_addon_configs:rw
