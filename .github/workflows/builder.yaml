name: Builder

env:
  MONITORED_FILES: "config.json config.yaml config.yml Dockerfile rootfs"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  init:
    name: Initialize builds
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
      changed_apps: ${{ steps.filter.outputs.changed_apps }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Get changed files
        id: changed_files
        uses: tj-actions/changed-files@v47

      - name: Find app directories
        id: apps
        uses: home-assistant/actions/helpers/find-addons@master

      - name: Filter changed apps
        id: filter
        env:
          APPS: ${{ steps.apps.outputs.addons }}
          CHANGED_FILES: ${{ steps.changed_files.outputs.all_changed_files }}
        run: |
        changed_apps=()

        # Normalize to one path per line
        mapfile -t files <<< "${CHANGED_FILES}"
        read -ra apps <<< "${APPS}"
        read -ra monitored <<< "${MONITORED_FILES}"

        workflow_changed=false
        for f in "${files[@]}"; do
          case "$f" in
            .github/workflows/builder.yaml|.github/workflows/build-app.yaml)
              workflow_changed=true; break ;;
          esac
        done

        if [[ "${workflow_changed}" == true ]]; then
          changed_apps=("${apps[@]}")
        else
          for app in "${apps[@]}"; do
            for file in "${monitored[@]}"; do
              if printf '%s\n' "${files[@]}" | grep -qxF "${app}/${file}"; then
                changed_apps+=("${app}")
                break
              fi
            done
          done
        fi

        if [[ ${#changed_apps[@]} -gt 0 ]]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "changed_apps=$(jq -nc '$ARGS.positional' --args "${changed_apps[@]}")" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

  build-app:
    name: Build ${{ matrix.app }}
    needs: init
    if: needs.init.outputs.changed == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.init.outputs.changed_apps) }}
    uses: ./.github/workflows/build-app.yaml
    with:
      app: ${{ matrix.app }}
      publish: ${{ github.event_name == 'push' }}
    secrets: inherit
